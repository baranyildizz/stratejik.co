<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#5BA3E6">

    <title>STRATEJİK Mimarlık ile Geliştirme</title>
    <meta name="description" content="Antalya merkezli mimarlık ve gayrimenkul geliştirme ofisi.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="stratejik.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Performans: Font ve Görselleri Önceden Yükleme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Masaüstü ve Mobil arka planları cihaza göre önceden yükleme (Endüstri Standardı) -->
    <link rel="preload" href="website-background-desktop.jpg" as="image" media="(min-width: 769px)">
    <link rel="preload" href="website-background-p1.jpg" as="image" media="(max-width: 768px)">

    <!-- CSS Dosyası -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header: Logo ve Dil Seçeneği -->
<header class="header">
        <a href="/" aria-label="Ana Sayfa" class="logo-link">
            <object data="stratejik_logo_animation.svg" type="image/svg+xml" class="logo" width="240" aria-label="STRATEJİK">
                <!-- Fallback (Desteklemeyen eski tarayıcılar için img yedeği) -->
                <img src="stratejik_logo_animation.svg" alt="Stratejik Mimarlık Logo" width="240" height="auto">
            </object>
        </a>
    <button id="langToggle" class="btn lang-toggle" aria-label="Dili İngilizceye Çevir">EN</button>
</header>
    <!-- Ana İçerik: Slogan ve Harekete Geçirici Mesaj -->
    <main class="main-content">
        <div class="text-container">
            <h1 class="main-headline" id="mainHeadline">Mimarlıkta Optimizasyon ile Katma Değerli Gayrimenkul Geliştiriyoruz.</h1>
            <p class="sub-headline" id="subHeadline">
                İlk tasarım kararlarından, projenin teslimine kadar her aşamasında stratejik kararlarla, potansiyeli sonuna kadar değerlendiren optimum çözümleri keşfediyoruz.
            </p>
            <a href="mailto:info@stratejik.co" class="btn cta-button" id="ctaBtn" role="button">İletişime Geçin</a>
        </div>
    </main>

    <!-- Footer: Sosyal Medya ve İletişim -->
    <footer class="footer">
        <a href="https://instagram.com/stratejik.co" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="mailto:info@stratejik.co">Email</a>
        <a href="https://maps.app.goo.gl/JWoJA8xjEqFPjVyT9" target="_blank" rel="noopener noreferrer">Antalya</a>
    </footer>

    <!-- Dil Değişimi Scripti -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const texts = {
                tr: {
                    mainHeadline: "Mimarlıkta Optimizasyon ile Katma Değerli Gayrimenkul Geliştiriyoruz.",
                    subHeadline: "İlk tasarım kararlarından, projenin teslimine kadar her aşamasında stratejik kararlarla, potansiyeli sonuna kadar değerlendiren optimum çözümleri keşfediyoruz.",
                    ctaBtn: "İletişime Geçin",
                    langLabel: "Dili İngilizceye Çevir"
                },
                en: {
                    mainHeadline: "We Develop Value-Added Real Estate with Optimization in Architecture.",
                    subHeadline: "From initial design to project delivery, we discover optimal solutions that fully realize the potential through strategic decisions at every stage.",
                    ctaBtn: "Contact Us",
                    langLabel: "Switch language to Turkish"
                }
            };
            
            let currentLang = 'tr';
            const langToggle = document.getElementById('langToggle');
            const mainHeadline = document.getElementById('mainHeadline');
            const subHeadline = document.getElementById('subHeadline');
            const ctaBtn = document.getElementById('ctaBtn');
            const elements = [mainHeadline, subHeadline, ctaBtn];

            langToggle.addEventListener('click', function() {
                currentLang = currentLang === 'tr' ? 'en' : 'tr';
                
                // Yumuşak geçiş için opacity sıfırlama
                elements.forEach(el => el.style.opacity = '0');
                
                setTimeout(() => {
                    mainHeadline.textContent = texts[currentLang].mainHeadline;
                    subHeadline.textContent = texts[currentLang].subHeadline;
                    ctaBtn.textContent = texts[currentLang].ctaBtn;
                    
                    langToggle.textContent = currentLang === 'tr' ? 'EN' : 'TR';
                    langToggle.setAttribute('aria-label', texts[currentLang].langLabel);
                    
                    // İçerik değiştikten sonra görünür yapma
                    elements.forEach(el => el.style.opacity = '1');
                }, 200); // CSS transition süresi ile eşzamanlı
            });
        });
    </script>
</body>
</html>

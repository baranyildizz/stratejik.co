        /* --- CSS Variables --- */
        :root {
            --primary-text: #ffffff;
            --bg-color: #000000;
            --cta-bg: rgba(255, 255, 255, 0.1);
            --cta-hover: rgba(255, 255, 255, 0.25);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --overlay-color: rgba(0, 0, 0, 0.3);
        }

        /* --- Reset & Base --- */
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: transparent;
            color: var(--primary-text);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- Background Video --- */
        .video-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-color: #000;
        }

        .video-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--overlay-color);
            z-index: 1;
            pointer-events: none;
        }

        .video-element {
            position: absolute;
            top: 50%; left: 50%; width: 100%; height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%);
            transition: opacity 1.5s ease-in-out;
            z-index: 0;
        }

        #bgVideoThumb { opacity: 1; filter: blur(20px); transform: translate(-50%, -50%) scale(1.1); }
        #bgVideo { opacity: 0; }

        /* --- Header --- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            /* Sol boşluk 6rem, main-content ile aynı hizada */
            padding: 3rem 6rem; 
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center; /* Dikey ortalama (Masaüstü için) */
        }

        .logo {
            /* MASAÜSTÜ: Temiz sayı */
            width: 400px;
            height: auto;
            filter: invert(100%);
            display: block;
            will-change: transform;
        }

        /* --- Main Content --- */
        .main-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            /* Header logosu ile aynı hizada başlaması için */
            padding-left: 6rem; 
            padding-right: 2rem;
            z-index: 10;
        }

        .text-container {
            max-width: 65%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Typography */
        .main-headline {
            font-size: clamp(1.8rem, 4vw, 3.5rem);
            font-weight: 700;
            line-height: 1.1;
            margin: 0;
            letter-spacing: -0.03em;
        }

        .sub-headline {
            font-size: clamp(1rem, 1.5vw, 1.5rem);
            line-height: 1.6;
            margin: 0;
            max-width: 90%;
            opacity: 0.95;
            font-weight: 400;
        }

        /* --- Buttons --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--primary-text);
            border: 1px solid var(--primary-text);
            border-radius: 50px;
            background: var(--cta-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
            font-weight: 500;
            outline: none;
        }

        .btn:focus-visible { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5); }
        .btn:hover { background: var(--cta-hover); }
        .btn:active { transform: scale(0.98); }

            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
            z-index: 102;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .cta-button {
            align-self: flex-start;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            margin-top: 1rem;
        }

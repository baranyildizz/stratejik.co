<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">

    <!-- SEO ve Sayfa Bilgileri -->
    <title>Stratejik | İnovatif Mimarlık ve Gayrimenkul Geliştirme</title>
    <meta name="description" content="Antalya merkezli mimarlık ve gayrimenkul geliştirme ofisi. Projelerinize inovasyon ve stratejik planlama ile değer katıyoruz.">
    <meta name="keywords" content="mimarlık, gayrimenkul geliştirme, antalya mimar, proje yönetimi, stratejik mimarlık, inovasyon">
    <meta name="author" content="Stratejik">
    <link rel="canonical" href="https://stratejik.co">

    <!-- Favicon (Marka Kimliği) -->
    <link rel="icon" type="image/svg+xml" href="stratejik.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Open Graph / Facebook & WhatsApp Önizlemeleri -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://stratejik.co/">
    <meta property="og:title" content="Stratejik | Mimarlıkta İnovasyon">
    <meta property="og:description" content="Mimari tasarım ve gayrimenkul geliştirmede stratejik çözümler.">
    <meta property="og:image" content="https://stratejik.co/social-share.jpg"> <!-- 1200x630px görsel önerilir -->

    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://stratejik.co/">
    <meta property="twitter:title" content="Stratejik | Mimarlıkta İnovasyon">
    <meta property="twitter:description" content="Mimari tasarım ve gayrimenkul geliştirmede stratejik çözümler.">
    <meta property="twitter:image" content="https://stratejik.co/social-share.jpg">
    
    <style>
        /* --- CSS Variables --- */
        :root {
            --primary-text: #ffffff;
            --bg-color: #000000;
            --cta-bg: rgba(255, 255, 255, 0.1);
            --cta-hover: rgba(255, 255, 255, 0.25);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --overlay-color: rgba(0, 0, 0, 0.3); /* Video üzeri karartma */
        }

        /* --- Reset & Base --- */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: transparent; /* DÜZELTME: Siyah ekranı kaldırmak için şeffaf yapıldı */
            color: var(--primary-text);
            overflow: hidden;
            -webkit-font-smoothing: antialiased; /* Fontları daha keskin yapar */
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- Background Video & Overlay --- */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #000;
        }

        /* Video'nun üzerine gelen hafif siyah katman (Okunabilirlik için şart) */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--overlay-color);
            z-index: 1; /* Videonun üstünde, içeriğin altında */
            pointer-events: none;
        }

        .video-element {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%);
            transition: opacity 1.5s ease-in-out;
            z-index: 0;
        }

        #bgVideoThumb { opacity: 1; filter: blur(20px); transform: translate(-50%, -50%) scale(1.1); }
        #bgVideo { opacity: 0; }

        /* --- Header --- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 3rem 4rem;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            width: 220px;
            height: auto;
            filter: invert(100%); /* İdeal dünyada buraya beyaz bir SVG koymalısın */
            display: block;
            will-change: transform; /* Performans optimizasyonu */
        }

        /* --- Main Content --- */
        .main-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 6rem;
            padding-right: 2rem;
            z-index: 10;
        }

        .text-container {
            max-width: 65%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Typography */
        .main-headline {
            font-size: clamp(1.8rem, 4vw, 3.5rem);
            font-weight: 700;
            line-height: 1.1;
            margin: 0;
            letter-spacing: -0.02em; /* Modern tipografi dokunuşu */
        }

        .sub-headline {
            font-size: clamp(1rem, 1.5vw, 1.5rem);
            line-height: 1.6;
            margin: 0;
            max-width: 90%;
            opacity: 0.95; /* Overlay olduğu için opaklığı artırdım */
        }

        /* --- Buttons --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--primary-text);
            border: 1px solid var(--primary-text);
            border-radius: 50px;
            background: var(--cta-bg);
            backdrop-filter: blur(10px); /* Blur artırıldı */
            -webkit-backdrop-filter: blur(10px); /* Safari desteği */
            transition: all 0.3s ease;
            cursor: pointer;
            font-weight: 500;
            outline: none;
        }

        .btn:focus-visible {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5); /* Klavye erişimi için focus halkası */
        }

        .btn:hover { background: var(--cta-hover); }
        .btn:active { transform: scale(0.98); }

        .lang-toggle {
            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
            z-index: 102;
            background: rgba(0,0,0,0.3); /* Dil butonu daha belirgin olsun */
            border: 1px solid rgba(255,255,255,0.3);
        }

        .cta-button {
            align-self: flex-start;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            margin-top: 1rem;
        }

        /* --- Footer --- */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 2rem 6rem;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            /* Gradient biraz daha yumuşatıldı */
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0) 100%);
            pointer-events: none; /* Footer alanı tıklamaları engellemesin */
        }
        
        .footer a {
            pointer-events: auto; /* Linkler tıklanabilsin */
            color: var(--primary-text);
            text-decoration: none;
            font-size: 1rem;
            opacity: 0.8;
            transition: opacity 0.3s;
            position: relative;
        }
        
        .footer a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: #fff;
            transition: width 0.3s ease-out;
        }

        .footer a:hover { opacity: 1; }
        .footer a:hover::after { width: 100%; }

        /* =========================================
           MOBILE & RESPONSIVE
           ========================================= */

        @media (max-width: 1024px) {
            .header { padding: 2rem; }
            .logo { width: 180px; }
            .main-content { padding: 0 2rem; justify-content: center; text-align: center; }
            .text-container { max-width: 100%; align-items: center; }
            .cta-button { align-self: center; }
            .footer { padding: 2rem; }
        }

        @media (max-width: 768px) {
            body { overflow-y: auto; overflow-x: hidden; }
            
            .header { padding: 1.5rem; justify-content: center; }
            .logo { width: 160px; position: relative; left: auto; transform: none; }
            
            .lang-toggle {
                position: absolute;
                right: 1.5rem;
                top: 1.5rem;
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }

            .main-content {
                position: relative;
                height: auto;
                min-height: 100dvh;
                padding: 140px 1.5rem 100px 1.5rem;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .text-container { gap: 2rem; }
            .main-headline { font-size: 1.75rem; }
            .sub-headline { font-size: 1rem; }
            
            .cta-button {
                width: 100%;
                max-width: 300px;
                padding: 1rem;
            }

            .footer {
                padding: 1.5rem;
                padding-bottom: calc(1rem + var(--safe-bottom));
                justify-content: space-around;
                background: linear-gradient(to top, rgba(0,0,0,0.95) 30%, rgba(0,0,0,0) 100%);
            }
            .footer a { font-size: 0.9rem; }
        }

        /* Landscape Optimization */
        @media (max-height: 500px) and (orientation: landscape) {
            .header { padding: 1rem 2rem; }
            .logo { width: 140px; }
            .lang-toggle { top: 1rem; right: 2rem; }
            
            .main-content {
                padding: 80px 2rem 60px 2rem;
                min-height: 100dvh;
            }

            .text-container {
                flex-direction: row;
                align-items: center;
                gap: 2rem;
                text-align: left;
                max-width: 900px;
            }

            .main-headline { font-size: 1.4rem; flex: 1; }
            .sub-headline { display: none; }
            
            .cta-button {
                margin: 0;
                padding: 0.6rem 1.5rem;
                font-size: 0.9rem;
                white-space: nowrap;
            }

            .footer {
                padding: 0.5rem 2rem;
                padding-bottom: env(safe-area-inset-bottom, 5px);
            }
            .footer a { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Overlay Katmanı: Yazı okunabilirliği için -->
        <div class="video-overlay"></div>
        
        <video id="bgVideoThumb" class="video-element" autoplay loop muted playsinline aria-hidden="true">
            <source src="videos/sea-thumbnail.mp4" type="video/mp4">
        </video>
        <video id="bgVideo" class="video-element" loop muted playsinline preload="auto" aria-hidden="true">
            <source src="videos/sea.mp4" type="video/mp4">
        </video>
    </div>

    <header class="header">
        <a href="/" aria-label="Ana Sayfa">
            <img src="stratejik.svg" alt="Stratejik Mimarlık Logo" class="logo">
        </a>
        <button id="langToggle" class="btn lang-toggle" aria-label="Dili İngilizceye Çevir">EN</button>
    </header>

    <main class="main-content">
        <div class="text-container">
            <div>
                <h1 class="main-headline" id="mainHeadline">Mimarlıkta İnovasyon ile Katma Değerli Gayrimenkul Geliştiriyoruz.</h1>
                <p class="sub-headline" id="subHeadline">
                    İlk tasarım kararlarından, projenin teslimine kadar her aşamasında stratejik kararlarla, potansiyeli sonuna kadar değerlendiren optimum çözümleri keşfediyoruz.
                </p>
            </div>
            <a href="mailto:info@stratejik.co" class="btn cta-button" id="ctaBtn" role="button">İletişime Geçin</a>
        </div>
    </main>

    <footer class="footer">
        <a href="https://instagram.com/stratejik.co" target="_blank" rel="noopener noreferrer" aria-label="Instagram sayfamızı ziyaret edin">Instagram</a>
        <a href="mailto:info@stratejik.co" aria-label="Bize e-posta gönderin">Email</a>
        <a href="https://maps.app.goo.gl/JWoJA8xjEqFPjVyT9" target="_blank" rel="noopener noreferrer" aria-label="Ofis konumunu haritada görün">Antalya</a>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- Dil Yönetimi ---
            const texts = {
                tr: {
                    mainHeadline: "Mimarlıkta İnovasyon ile Katma Değerli Gayrimenkul Geliştiriyoruz.",
                    subHeadline: "İlk tasarım kararlarından, projenin teslimine kadar her aşamasında stratejik kararlarla, potansiyeli sonuna kadar değerlendiren optimum çözümleri keşfediyoruz.",
                    ctaBtn: "İletişime Geçin",
                    langLabel: "Dili İngilizceye Çevir"
                },
                en: {
                    mainHeadline: "We Develop Value-Added Real Estate with Innovation in Architecture.",
                    subHeadline: "From initial design decisions to delivery, we discover optimal solutions that fully realize potential through strategic choices at every stage.",
                    ctaBtn: "Contact Us",
                    langLabel: "Switch language to Turkish"
                }
            };
            let currentLang = 'tr';

            const langToggle = document.getElementById('langToggle');
            const mainHeadline = document.getElementById('mainHeadline');
            const subHeadline = document.getElementById('subHeadline');
            const ctaBtn = document.getElementById('ctaBtn');

            langToggle.onclick = function() {
                currentLang = currentLang === 'tr' ? 'en' : 'tr';
                
                // Fade out
                const elements = [mainHeadline, subHeadline, ctaBtn];
                elements.forEach(el => el.style.opacity = '0');
                
                setTimeout(() => {
                    // Update text
                    mainHeadline.textContent = texts[currentLang].mainHeadline;
                    subHeadline.textContent = texts[currentLang].subHeadline;
                    ctaBtn.textContent = texts[currentLang].ctaBtn;
                    
                    // Update Button State
                    langToggle.textContent = currentLang === 'tr' ? 'EN' : 'TR';
                    langToggle.setAttribute('aria-label', texts[currentLang].langLabel);
                    
                    // Fade in
                    elements.forEach(el => el.style.opacity = '1');
                }, 200);
            };

            // Transition styles
            [mainHeadline, subHeadline, ctaBtn].forEach(el => {
                el.style.transition = 'opacity 0.2s ease';
            });

            // --- Video Yönetimi ---
            const thumbVideo = document.getElementById('bgVideoThumb');
            const mainVideo = document.getElementById('bgVideo');

            const startVideos = () => {
                thumbVideo.play().catch(() => {});
                mainVideo.play().catch(() => {});
            };

            document.body.addEventListener('click', startVideos, { once: true });
            document.body.addEventListener('touchstart', startVideos, { once: true });

            thumbVideo.play().catch(() => {});
            mainVideo.play().catch(() => {});

            mainVideo.addEventListener('canplaythrough', () => {
                mainVideo.style.opacity = '1';
                setTimeout(() => {
                    thumbVideo.style.opacity = '0';
                    // Thumbnail'i durdurarak işlemciyi rahatlat
                    setTimeout(() => thumbVideo.pause(), 1000); 
                }, 500);
            }, { once: true });
            
            mainVideo.addEventListener('error', () => {
                thumbVideo.style.opacity = '1';
                mainVideo.style.opacity = '0';
            });
        });
    </script>
</body>
</html>

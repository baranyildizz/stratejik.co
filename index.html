<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Stratejik | İnovatif Mimarlık ve Gayrimenkul Geliştirme</title>
    <meta name="description" content="Stratejik, mimarlık ve gayrimenkul geliştirme süreçlerini birleştirerek projelere katma değer, optimizasyon ve inovasyon katar. Antalya merkezli projeler.">
    
    <style>
        /* --- CSS Variables --- */
        :root {
            --primary-text: #ffffff;
            --bg-color: #000000;
            --cta-bg: rgba(255, 255, 255, 0.1);
            --cta-hover: rgba(255, 255, 255, 0.25);
            --safe-bottom: env(safe-area-inset-bottom, 20px); /* iPhone Home Bar güvenli alan */
        }

        /* --- Reset & Base --- */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-text);
            overflow: hidden; /* Scroll engelleme */
        }

        /* --- Background Video --- */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #000; /* Video yüklenene kadar siyah */
        }

        .video-element {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%);
            transition: opacity 1.5s ease-in-out;
        }

        #bgVideoThumb { opacity: 1; filter: blur(20px); transform: translate(-50%, -50%) scale(1.1); }
        #bgVideo { opacity: 0; }

        /* --- Header --- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 3rem 4rem;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* Header arkaplanı kaldırıldı, temiz görünüm için */
        }

        .logo {
            width: 220px;
            height: auto;
            filter: invert(100%);
            display: block;
        }

        /* --- Main Content --- */
        .main-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
            display: flex;
            align-items: center; /* Dikey ortalama */
            justify-content: flex-start;
            padding-left: 6rem;
            padding-right: 2rem;
            z-index: 10;
        }

        .text-container {
            max-width: 65%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem; /* Başlıklar arası boşluk yönetimi */
        }

        /* Responsive Typography with clamp() */
        .main-headline {
            font-size: clamp(1.8rem, 4vw, 3.5rem);
            font-weight: 700;
            line-height: 1.1;
            margin: 0;
        }

        .sub-headline {
            font-size: clamp(1rem, 1.5vw, 1.5rem);
            line-height: 1.6;
            margin: 0;
            max-width: 90%;
            opacity: 0.9;
        }

        /* --- CTA Button & Lang Toggle --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--primary-text);
            border: 1px solid var(--primary-text);
            border-radius: 50px;
            background: var(--cta-bg);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            cursor: pointer;
            font-weight: 500;
        }

        .btn:hover { background: var(--cta-hover); }
        .btn:active { transform: scale(0.98); }

        .lang-toggle {
            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
            z-index: 102; /* Logodan yukarıda */
        }

        .cta-button {
            align-self: flex-start; /* Sola yasla */
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            margin-top: 1rem;
        }

        /* --- Footer --- */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 2rem 6rem;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }

        .footer a {
            color: var(--primary-text);
            text-decoration: none;
            font-size: 1rem;
            opacity: 0.8;
            transition: opacity 0.3s;
            position: relative;
        }
        
        .footer a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: #fff;
            transition: width 0.3s;
        }

        .footer a:hover { opacity: 1; }
        .footer a:hover::after { width: 100%; }

        /* =========================================
           MOBILE & RESPONSIVE AYARLARI
           ========================================= */

        /* 1. Tablet ve Mobil (Dikey) */
        @media (max-width: 1024px) {
            .header { padding: 2rem; }
            .logo { width: 180px; }
            .main-content { padding: 0 2rem; justify-content: center; text-align: center; }
            .text-container { max-width: 100%; align-items: center; }
            .cta-button { align-self: center; }
            .footer { padding: 2rem; }
        }

        /* 2. Mobil Dikey (Telefonlar) */
        @media (max-width: 768px) {
            body { overflow-y: auto; overflow-x: hidden; } /* Scrolla izin ver ama yatay taşmayı engelle */
            
            .header {
                padding: 1.5rem;
                justify-content: center; /* Logoyu ortala */
            }

            .logo {
                width: 160px;
                /* Mutlak pozisyon yerine flex ile ortalama */
                position: relative; 
                transform: none; 
                left: auto;
            }

            .lang-toggle {
                position: absolute;
                right: 1.5rem;
                top: 1.5rem;
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }

            .main-content {
                position: relative; /* Fixed yerine relative akış */
                height: auto;
                min-height: 100dvh;
                padding: 140px 1.5rem 100px 1.5rem; /* Header ve Footer payları */
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .text-container { gap: 2rem; }
            .main-headline { font-size: 1.75rem; }
            .sub-headline { font-size: 1rem; }
            
            .cta-button {
                width: 100%; /* Tam genişlik butonu mobilde daha kolay tıklanır */
                max-width: 300px;
                padding: 1rem;
            }

            .footer {
                padding: 1.5rem;
                padding-bottom: calc(1rem + var(--safe-bottom));
                justify-content: space-around;
                background: linear-gradient(to top, rgba(0,0,0,0.9) 20%, rgba(0,0,0,0) 100%);
            }
            
            .footer a { font-size: 0.9rem; }
        }

        /* 3. Landscape Modu (Telefonu yan çevirince) 
           Yükseklik az olduğu için her şeyi küçültüyoruz */
        @media (max-height: 500px) and (orientation: landscape) {
            .header { padding: 1rem 2rem; }
            .logo { width: 140px; }
            .lang-toggle { top: 1rem; right: 2rem; }
            
            .main-content {
                padding: 80px 2rem 60px 2rem; /* Üst ve alt boşlukları azalt */
                min-height: 100dvh;
            }

            .text-container {
                flex-direction: row; /* Yazı ve butonu yan yana al */
                align-items: center;
                gap: 2rem;
                text-align: left;
                max-width: 900px;
            }

            .main-headline { font-size: 1.4rem; flex: 1; }
            .sub-headline { display: none; } /* Yer yoksa alt metni gizle veya çok küçült */
            
            .cta-button {
                margin: 0;
                padding: 0.6rem 1.5rem;
                font-size: 0.9rem;
                white-space: nowrap;
            }

            .footer {
                padding: 0.5rem 2rem;
                padding-bottom: env(safe-area-inset-bottom, 5px);
            }
            .footer a { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="video-background">
        <!-- Poster attribute eklemek iyi bir pratiktir -->
        <video id="bgVideoThumb" class="video-element" autoplay loop muted playsinline>
            <source src="videos/sea-thumbnail.mp4" type="video/mp4">
        </video>
        <video id="bgVideo" class="video-element" loop muted playsinline preload="auto">
            <source src="videos/sea.mp4" type="video/mp4">
        </video>
    </div>

    <header class="header">
        <img src="stratejik.svg" alt="Stratejik Logo" class="logo">
        <button id="langToggle" class="btn lang-toggle">EN</button>
    </header>

    <main class="main-content">
        <div class="text-container">
            <div>
                <h1 class="main-headline" id="mainHeadline">Mimarlıkta İnovasyon ile Katma Değerli Gayrimenkul Geliştiriyoruz.</h1>
                <p class="sub-headline" id="subHeadline">
                    İlk tasarım kararlarından, projenin teslimine kadar her aşamasında stratejik kararlarla, potansiyeli sonuna kadar değerlendiren optimum çözümleri keşfediyoruz.
                </p>
            </div>
            <a href="mailto:baranyildiz4@gmail.com" class="btn cta-button" id="ctaBtn">İletişime Geçin</a>
        </div>
    </main>

    <footer class="footer">
        <a href="https://instagram.com/stratejik.co" target="_blank">Instagram</a>
        <a href="mailto:baranyildiz4@gmail.com">Email</a>
        <a href="https://maps.app.goo.gl/JWoJA8xjEqFPjVyT9" target="_blank">Antalya</a>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- Dil Yönetimi ---
            const texts = {
                tr: {
                    mainHeadline: "Mimarlıkta İnovasyon ile Katma Değerli Gayrimenkul Geliştiriyoruz.",
                    subHeadline: "İlk tasarım kararlarından, projenin teslimine kadar her aşamasında stratejik kararlarla, potansiyeli sonuna kadar değerlendiren optimum çözümleri keşfediyoruz.",
                    ctaBtn: "İletişime Geçin"
                },
                en: {
                    mainHeadline: "We Develop Value-Added Real Estate with Innovation in Architecture.",
                    subHeadline: "From initial design decisions to delivery, we discover optimal solutions that fully realize potential through strategic choices at every stage.",
                    ctaBtn: "Contact Us"
                }
            };
            let currentLang = 'tr';

            const langToggle = document.getElementById('langToggle');
            const mainHeadline = document.getElementById('mainHeadline');
            const subHeadline = document.getElementById('subHeadline');
            const ctaBtn = document.getElementById('ctaBtn');

            langToggle.onclick = function() {
                currentLang = currentLang === 'tr' ? 'en' : 'tr';
                // Yumuşak geçiş efekti için
                const elements = [mainHeadline, subHeadline, ctaBtn];
                elements.forEach(el => el.style.opacity = '0');
                
                setTimeout(() => {
                    mainHeadline.textContent = texts[currentLang].mainHeadline;
                    subHeadline.textContent = texts[currentLang].subHeadline;
                    ctaBtn.textContent = texts[currentLang].ctaBtn;
                    langToggle.textContent = currentLang === 'tr' ? 'EN' : 'TR';
                    elements.forEach(el => el.style.opacity = '1');
                }, 200);
            };

            // Metin geçiş css'i
            [mainHeadline, subHeadline, ctaBtn].forEach(el => {
                el.style.transition = 'opacity 0.2s ease';
            });

            // --- Video Yönetimi ---
            const thumbVideo = document.getElementById('bgVideoThumb');
            const mainVideo = document.getElementById('bgVideo');

            const startVideos = () => {
                thumbVideo.play().catch(e => console.log("Thumb play error", e));
                mainVideo.play().catch(e => console.log("Main play error", e));
            };

            // Modern tarayıcılar için etkileşim
            document.body.addEventListener('click', startVideos, { once: true });
            document.body.addEventListener('touchstart', startVideos, { once: true });

            thumbVideo.play().catch(() => {});
            mainVideo.play().catch(() => {});

            mainVideo.addEventListener('canplaythrough', () => {
                mainVideo.style.opacity = '1';
                setTimeout(() => {
                    thumbVideo.style.opacity = '0';
                }, 500); // Biraz daha yumuşak geçiş
            }, { once: true });
            
            mainVideo.addEventListener('error', () => {
                thumbVideo.style.opacity = '1';
                mainVideo.style.opacity = '0';
            });
        });
    </script>
</body>
</html>
